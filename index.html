    function hostStartOnlineGame() {
      if (!onlineState.isHost) return;
      const fillAI = document.getElementById('fill-ai-checkbox')?.checked;
      const aiDiff = document.getElementById('online-ai-diff')?.value || 'hard';

      const players = onlineState.members.map(m => ({
        id: m.id,
        name: m.name,
        avatar: m.avatar,
        isAI: !!m.isAI,
        isHost: m.id === myPeerId,
        hand: [],
        melded: false,
        score: 0
      }));

      const botNames = ['AI 戰術師', 'AI 拆牌王', 'AI 閃電手'];
      const botAvatars = ['🤖', '🐯', '🐧'];
      let botIdx = 0;
      if (fillAI) {
        while (players.length < 4) {
          players.push({
            id: 'ai_online_' + (botIdx + 1),
            name: botNames[botIdx],
            avatar: botAvatars[botIdx],
            isAI: true,
            isHost: false,
            hand: [],
            melded: false,
            score: 0
          });
          botIdx++;
        }
      }

      if (players.length < 2) {
        showToast('至少需要 2 位玩家才能開始對戰！', 'error');
        return;
      }

      initMatchWithPlayers(players, 'online', aiDiff);
      syncOnlineGameState('START_ONLINE_GAME');
    }

    function initMatchWithPlayers(players, mode, aiDiff) {
      cleanupDragGhost();
      const deck = createFullDeck();
      players.forEach(p => {
        p.hand = deck.splice(0, 14);
        p.hand = sortTilesRunOrder(p.hand);
        p.melded = false;
      });

      gameState.active = true;
      gameState.mode = mode;
      gameState.aiDifficulty = aiDiff;
      gameState.players = players;
      gameState.pool = deck;
      gameState.tableMelds = [];
      gameState.turnIndex = 0;
      gameState.newlyPlayedTileIds = new Set();
      gameState.selectedTileIds = new Set();
      gameState.hintTileIds = new Set();
      gameState.chatBubbles = {};

      document.getElementById('gameover-modal').classList.add('hidden');
      document.getElementById('lobby-view').classList.add('hidden');
      document.getElementById('game-view').classList.remove('hidden');

      saveTurnSnapshot();
      updateResponsiveLayout();
      renderAll();
      startTurnCountdown();
      playTone(520, 0.12);

      const first = gameState.players[0];
      if (first && first.isAI) scheduleAITurn();
    }

    function restartCurrentGame() {
      if (gameState.mode === 'online' && !onlineState.isHost) {
        showToast('等待房主重新開局...', 'info');
        return;
      }
      const resetPlayers = gameState.players.map(p => ({
        ...p,
        hand: [],
        melded: false
      }));
      initMatchWithPlayers(resetPlayers, gameState.mode, gameState.aiDifficulty);
      if (gameState.mode === 'online') syncOnlineGameState('START_ONLINE_GAME');
    }

    function syncOnlineGameState(packetType = 'GAME_STATE_SYNC') {
      if (gameState.mode !== 'online') return;
      const snapshot = {
        aiDifficulty: gameState.aiDifficulty,
        players: JSON.parse(JSON.stringify(gameState.players)),
        pool: JSON.parse(JSON.stringify(gameState.pool)),
        tableMelds: JSON.parse(JSON.stringify(gameState.tableMelds)),
        turnIndex: gameState.turnIndex,
        newlyPlayedIds: Array.from(gameState.newlyPlayedTileIds)
      };
      sendRoomMessage({
        type: packetType,
        senderId: myPeerId,
        snapshot
      });
    }

    function applySyncedGameState(snapshot, isInitialStart) {
      if (!snapshot) return;
      cleanupDragGhost();
      gameState.active = true;
      gameState.mode = 'online';
      gameState.aiDifficulty = snapshot.aiDifficulty || 'hard';
      gameState.players = snapshot.players;
      gameState.pool = snapshot.pool;
      gameState.tableMelds = snapshot.tableMelds;
      gameState.turnIndex = snapshot.turnIndex;
      gameState.newlyPlayedTileIds = new Set(snapshot.newlyPlayedIds || []);
      gameState.selectedTileIds = new Set();
      gameState.hintTileIds = new Set();

      if (isInitialStart) {
        document.getElementById('gameover-modal').classList.add('hidden');
        document.getElementById('lobby-view').classList.add('hidden');
        document.getElementById('game-view').classList.remove('hidden');
      }

      saveTurnSnapshot();
      updateResponsiveLayout();
      renderAll();
      startTurnCountdown();
      checkWinCondition();
    }

    // ==================== 卡牌總數守恆護欄（防遺失核心） ====================
    function collectAllTileIdsFromState(stateObj) {
      const ids = [];
      (stateObj.pool || []).forEach(t => ids.push(t.id));
      (stateObj.tableMelds || []).forEach(m => (m.tiles || []).forEach(t => ids.push(t.id)));
      (stateObj.players || []).forEach(p => (p.hand || []).forEach(t => ids.push(t.id)));
      return ids;
    }

    function saveTurnSnapshot() {
      gameState.turnSnapshot = {
        pool: JSON.parse(JSON.stringify(gameState.pool)),
        tableMelds: JSON.parse(JSON.stringify(gameState.tableMelds)),
        players: JSON.parse(JSON.stringify(gameState.players))
      };
    }

    function runProtectedMutation(mutatorFn) {
      const beforeSnapshot = {
        pool: JSON.parse(JSON.stringify(gameState.pool)),
        tableMelds: JSON.parse(JSON.stringify(gameState.tableMelds)),
        players: JSON.parse(JSON.stringify(gameState.players))
      };
      const beforeIds = collectAllTileIdsFromState(beforeSnapshot).sort();

      mutatorFn();

      const afterIds = collectAllTileIdsFromState(gameState).sort();
      const conserved = beforeIds.length === afterIds.length && beforeIds.every((id, i) => id === afterIds[i]);
      if (!conserved) {
        gameState.pool = beforeSnapshot.pool;
        gameState.tableMelds = beforeSnapshot.tableMelds;
        gameState.players = beforeSnapshot.players;
        showToast('偵測到異常牌張變動，已自動還原以保護卡牌不遺失！', 'error');
        renderAll();
        return false;
      }
      return true;
    }

    // ==================== 拉密合法牌組驗證與分數計算 ====================
    function validateMeld(tiles) {
      if (!tiles || tiles.length < 3) return { valid: false, points: 0, type: null };

      const nonJokers = tiles.filter(t => !t.isJoker);
      const jokerCount = tiles.length - nonJokers.length;

      if (nonJokers.length === 0) {
        return { valid: tiles.length >= 3, points: 30, type: 'group' };
      }

      if (tiles.length <= 4) {
        const targetNum = nonJokers[0].number;
        const sameNum = nonJokers.every(t => t.number === targetNum);
        const colors = new Set(nonJokers.map(t => t.color));
        if (sameNum && colors.size === nonJokers.length) {
          return {
            valid: true,
            points: targetNum * tiles.length,
            type: 'group'
          };
        }
      }

      if (tiles.length <= 13) {
        const targetColor = nonJokers[0].color;
        if (nonJokers.every(t => t.color === targetColor)) {
          const nums = nonJokers.map(t => t.number).sort((a, b) => a - b);
          let hasDup = false;
          for (let i = 1; i < nums.length; i++) {
            if (nums[i] === nums[i - 1]) hasDup = true;
          }
          if (!hasDup) {
            const minN = nums[0];
            const maxN = nums[nums.length - 1];
            const span = maxN - minN + 1;
            const neededJokers = span - nums.length;
            if (neededJokers <= jokerCount) {
              const extraJokers = jokerCount - neededJokers;
              let startNum = minN;
              let endNum = maxN;
              for (let e = 0; e < extraJokers; e++) {
                if (endNum < 13) endNum++;
                else if (startNum > 1) startNum--;
              }
              if (endNum - startNum + 1 === tiles.length) {
                let pts = 0;
                for (let n = startNum; n <= endNum; n++) pts += n;
                return { valid: true, points: pts, type: 'run' };
              }
            }
          }
        }
      }

      return { valid: false, points: 0, type: null };
    }

    function arrangeMeldDisplayOrder(tiles) {
      const res = validateMeld(tiles);
      if (!res.valid) return tiles;
      const nonJokers = tiles.filter(t => !t.isJoker);
      const jokers = tiles.filter(t => t.isJoker);
      if (nonJokers.length === 0) return tiles;

      if (res.type === 'group') {
        nonJokers.sort((a, b) => COLOR_ORDER[a.color] - COLOR_ORDER[b.color]);
        return [...nonJokers, ...jokers];
      } else {
        nonJokers.sort((a, b) => a.number - b.number);
        const minN = nonJokers[0].number;
        const maxN = nonJokers[nonJokers.length - 1].number;
        const needed = (maxN - minN + 1) - nonJokers.length;
        const extra = jokers.length - needed;
        let startN = minN;
        let endN = maxN;
        for (let e = 0; e < extra; e++) {
          if (endN < 13) endNum++;
          else if (startN > 1) startN--;
        }
        const byNum = new Map(nonJokers.map(t => [t.number, t]));
        const ordered = [];
        let jIdx = 0;
        for (let n = startN; n <= endN; n++) {
          if (byNum.has(n)) ordered.push(byNum.get(n));
          else if (jIdx < jokers.length) ordered.push(jokers[jIdx++]);
        }
        return ordered;
      }
    }

    function trySmartSplitMeld(tiles) {
      if (tiles.length < 6) return null;
      const n = tiles.length;
      const maxMask = 1 << n;
      for (let mask = 1; mask < maxMask - 1; mask++) {
        const g1 = [];
        const g2 = [];
        for (let i = 0; i < n; i++) {
          if (mask & (1 << i)) g1.push(tiles[i]);
          else g2.push(tiles[i]);
        }
        if (g1.length >= 3 && g2.length >= 3) {
          if (validateMeld(g1).valid && validateMeld(g2).valid) {
            return [arrangeMeldDisplayOrder(g1), arrangeMeldDisplayOrder(g2)];
          }
        }
      }
      return null;
    }

    // ==================== 手牌排序與整組牌自動偵測 ====================
    function sortTilesRunOrder(tiles) {
      return [...tiles].sort((a, b) => {
        if (a.isJoker !== b.isJoker) return a.isJoker ? 1 : -1;
        if (a.color !== b.color) return COLOR_ORDER[a.color] - COLOR_ORDER[b.color];
        return a.number - b.number;
      });
    }

    function sortTilesGroupOrder(tiles) {
      return [...tiles].sort((a, b) => {
        if (a.isJoker !== b.isJoker) return a.isJoker ? 1 : -1;
        if (a.number !== b.number) return a.number - b.number;
        return COLOR_ORDER[a.color] - COLOR_ORDER[b.color];
      });
    }

    function sortRackByRuns() {
      const me = getMyPlayer();
      if (!me) return;
      me.hand = sortTilesRunOrder(me.hand);
      playTone(460, 0.06);
      renderRack();
    }

    function sortRackByGroups() {
      const me = getMyPlayer();
      if (!me) return;
      me.hand = sortTilesGroupOrder(me.hand);
      playTone(520, 0.06);
      renderRack();
    }

    function detectContiguousRackMeldAtTile(tileId) {
      const me = getMyPlayer();
      if (!me) return [tileId];
      const idx = me.hand.findIndex(t => t.id === tileId);
      if (idx === -1) return [tileId];

      let bestSlice = [tileId];
      for (let start = Math.max(0, idx - 12); start <= idx; start++) {
        for (let end = idx; end < Math.min(me.hand.length, start + 13); end++) {
          const len = end - start + 1;
          if (len >= 3 && len > bestSlice.length) {
            const slice = me.hand.slice(start, end + 1);
            if (validateMeld(slice).valid) {
              bestSlice = slice.map(t => t.id);
            }
          }
        }
      }
      return bestSlice;
    }

    // ==================== 玩家回合操作與驗證 ====================
    function getMyPlayer() {
      return gameState.players.find(p => p.id === myPeerId) || gameState.players[0];
    }

    function isMyTurn() {
      const cur = gameState.players[gameState.turnIndex];
      return cur && cur.id === myPeerId && gameState.active;
    }

    function hasBoardChangesThisTurn() {
      if (!gameState.turnSnapshot) return false;
      const snapMe = gameState.turnSnapshot.players.find(p => p.id === myPeerId);
      const curMe = getMyPlayer();
      if (!snapMe || !curMe) return false;
      return curMe.hand.length !== snapMe.hand.length ||
        JSON.stringify(gameState.tableMelds.map(m => m.tiles.map(t => t.id))) !==
        JSON.stringify(gameState.turnSnapshot.tableMelds.map(m => m.tiles.map(t => t.id)));
    }

    function playSelectedTilesToNewMeld() {
      if (!isMyTurn()) {
        showToast('目前不是你的回合');
        return;
      }
      const me = getMyPlayer();
      if (!me || gameState.selectedTileIds.size === 0) return;

      const selectedIds = new Set(gameState.selectedTileIds);
      const movedTiles = [];

      const ok = runProtectedMutation(() => {
        me.hand = me.hand.filter(t => {
          if (selectedIds.has(t.id)) {
            movedTiles.push(t);
            return false;
          }
          return true;
        });

        gameState.tableMelds.forEach(m => {
          m.tiles = m.tiles.filter(t => {
            if (selectedIds.has(t.id)) {
              movedTiles.push(t);
              return false;
            }
            return true;
          });
        });
        gameState.tableMelds = gameState.tableMelds.filter(m => m.tiles.length > 0);

        if (movedTiles.length > 0) {
          const ordered = arrangeMeldDisplayOrder(movedTiles);
          gameState.tableMelds.push({
            id: 'meld_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            tiles: ordered
          });
          movedTiles.forEach(t => gameState.newlyPlayedTileIds.add(t.id));
        }
      });

      if (ok) {
        gameState.selectedTileIds.clear();
        gameState.hintTileIds.clear();
        playTone(620, 0.08);
        renderAll();
      }
    }

    function appendSelectedToExistingMeld(targetMeldId) {
      if (!isMyTurn()) {
        showToast('目前不是你的回合');
        return;
      }
      const me = getMyPlayer();
      const targetMeld = gameState.tableMelds.find(m => m.id === targetMeldId);
      if (!me || !targetMeld || gameState.selectedTileIds.size === 0) return;

      const selectedIds = new Set(gameState.selectedTileIds);
      const allAlreadyInTarget = Array.from(selectedIds).every(id => targetMeld.tiles.some(t => t.id === id));
      if (allAlreadyInTarget) {
        gameState.selectedTileIds.clear();
        renderAll();
        return;
      }

      const ok = runProtectedMutation(() => {
        const extracted = [];
        me.hand = me.hand.filter(t => {
          if (selectedIds.has(t.id)) {
            extracted.push(t);
            return false;
          }
          return true;
        });

        gameState.tableMelds.forEach(m => {
          if (m.id === targetMeldId) return;
          m.tiles = m.tiles.filter(t => {
            if (selectedIds.has(t.id)) {
              extracted.push(t);
              return false;
            }
            return true;
          });
        });

        const combined = [...targetMeld.tiles, ...extracted];
        const splitResult = !validateMeld(combined).valid ? trySmartSplitMeld(combined) : null;

        if (splitResult) {
          targetMeld.tiles = splitResult[0];
          gameState.tableMelds.push({
            id: 'meld_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            tiles: splitResult[1]
          });
          showToast('已自動智能拆分為兩組合法牌組！', 'success');
        } else {
          targetMeld.tiles = arrangeMeldDisplayOrder(combined);
        }

        extracted.forEach(t => gameState.newlyPlayedTileIds.add(t.id));
        gameState.tableMelds = gameState.tableMelds.filter(m => m.tiles.length > 0);
      });

      if (ok) {
        gameState.selectedTileIds.clear();
        gameState.hintTileIds.clear();
        playTone(680, 0.08);
        renderAll();
      }
    }

    function returnSelectedTableTilesToRack() {
      if (!isMyTurn() || !gameState.turnSnapshot) return;
      const me = getMyPlayer();
      const snapMe = gameState.turnSnapshot.players.find(p => p.id === myPeerId);
      if (!me || !snapMe) return;

      const myOriginIds = new Set(snapMe.hand.map(t => t.id));
      const toReturn = Array.from(gameState.selectedTileIds).filter(id =>
        myOriginIds.has(id) && gameState.tableMelds.some(m => m.tiles.some(t => t.id === id))
      );

      if (toReturn.length === 0) {
        showToast('只能拿回本回合剛打出的手牌喔！', 'error');
        return;
      }

      const returnSet = new Set(toReturn);
      const ok = runProtectedMutation(() => {
        const recovered = [];
        gameState.tableMelds.forEach(m => {
          m.tiles = m.tiles.filter(t => {
            if (returnSet.has(t.id)) {
              recovered.push(t);
              return false;
            }
            return true;
          });
        });
        gameState.tableMelds = gameState.tableMelds.filter(m => m.tiles.length > 0);
        me.hand.push(...recovered);
        recovered.forEach(t => gameState.newlyPlayedTileIds.delete(t.id));
      });

      if (ok) {
        gameState.selectedTileIds.clear();
        playTone(400, 0.08);
        renderAll();
      }
    }

    function resetCurrentTurn() {
      if (!isMyTurn() || !gameState.turnSnapshot) return;
      cleanupDragGhost();
      gameState.pool = JSON.parse(JSON.stringify(gameState.turnSnapshot.pool));
      gameState.tableMelds = JSON.parse(JSON.stringify(gameState.turnSnapshot.tableMelds));
      gameState.players = JSON.parse(JSON.stringify(gameState.turnSnapshot.players));
      gameState.newlyPlayedTileIds.clear();
      gameState.selectedTileIds.clear();
      gameState.hintTileIds.clear();
      playTone(360, 0.08);
      renderAll();
      showToast('已重置本回合桌面與手牌');
    }

    function handlePrimaryTurnAction() {
      if (!isMyTurn()) {
        showToast('目前不是你的回合');
        return;
      }
      if (hasBoardChangesThisTurn()) {
        confirmEndTurn();
      } else {
        drawTileAndEndTurn();
      }
    }

    function drawTileAndEndTurn() {
      const currentPlayer = gameState.players[gameState.turnIndex];
      if (!currentPlayer) return;
      if (currentPlayer.id === myPeerId && hasBoardChangesThisTurn()) {
        resetCurrentTurn();
      }

      if (gameState.pool.length > 0) {
        let drawnTile = null;
        const ok = runProtectedMutation(() => {
          drawnTile = gameState.pool.pop();
          if (drawnTile) {
            currentPlayer.hand.push(drawnTile);
          }
        });
        if (ok && drawnTile) {
          if (currentPlayer.id === myPeerId) {
            playTone(440, 0.09);
            showToast('已從牌庫抽 1 張牌');
          } else {
            playTone(390, 0.06);
            triggerPlayerBubble(currentPlayer.id, '🃏 抽 1 張牌');
          }
        }
      } else {
        if (currentPlayer.id === myPeerId) {
          showToast('牌庫已無剩餘牌張，直接換下一位');
        } else {
          triggerPlayerBubble(currentPlayer.id, '無牌可抽，跳過回合');
        }
      }
      advanceToNextTurn();
    }

    function confirmEndTurn() {
      const me = getMyPlayer();
      const snapMe = gameState.turnSnapshot.players.find(p => p.id === myPeerId);
      if (!me || !snapMe) return;

      const playedCount = snapMe.hand.length - me.hand.length;
      if (playedCount <= 0) {
        showToast('你還沒有打出任何手牌，若無牌可出請先按「重置」再「抽牌」', 'error');
        return;
      }

      for (const m of gameState.tableMelds) {
        if (!validateMeld(m.tiles).valid) {
          showToast('牌桌上仍有不合法的牌組（紅框標示），請調整後再出牌！', 'error');
          return;
        }
      }

      if (!me.melded) {
        const snapMeldIds = new Set(gameState.turnSnapshot.tableMelds.map(m => m.id));
        const newMelds = gameState.tableMelds.filter(m => !snapMeldIds.has(m.id));
        const movedExisting = gameState.tableMelds.some(m =>
          snapMeldIds.has(m.id) &&
          JSON.stringify(m.tiles.map(t => t.id)) !==
          JSON.stringify((gameState.turnSnapshot.tableMelds.find(sm => sm.id === m.id)?.tiles || []).map(t => t.id))
        );

        if (movedExisting) {
          showToast('尚未完成「30 分破冰」前，不能移動或併入牌桌既有牌組！', 'error');
          return;
        }

        let icebreakPts = 0;
        newMelds.forEach(m => { icebreakPts += validateMeld(m.tiles).points; });
        if (icebreakPts < 30) {
          showToast(`首次破冰需達 30 分（目前僅 ${icebreakPts} 分）！`, 'error');
          return;
        }
        me.melded = true;
        showToast(`🎉 破冰成功！總計 ${icebreakPts} 分！`, 'success');
      }

      playTone(760, 0.14);
      if (checkWinCondition()) return;
      advanceToNextTurn();
    }

    function advanceToNextTurn() {
      cleanupDragGhost();
      gameState.selectedTileIds.clear();
      gameState.hintTileIds.clear();
      gameState.turnIndex = (gameState.turnIndex + 1) % gameState.players.length;
      saveTurnSnapshot();
      updateResponsiveLayout();
      renderAll();
      startTurnCountdown();

      if (gameState.mode === 'online') syncOnlineGameState('GAME_STATE_SYNC');

      const cur = gameState.players[gameState.turnIndex];
      if (cur && cur.isAI && (gameState.mode === 'solo' || onlineState.isHost)) {
        scheduleAITurn();
      }
    }

    function startTurnCountdown() {
      if (gameState.turnTimerId) clearInterval(gameState.turnTimerId);
      gameState.turnTimeLeft = 60;
      const timerEl = document.getElementById('turn-timer');
      if (timerEl) timerEl.textContent = '60s';

      gameState.turnTimerId = setInterval(() => {
        if (!gameState.active) {
          clearInterval(gameState.turnTimerId);
          return;
        }
        gameState.turnTimeLeft--;
        if (timerEl) {
          timerEl.textContent = gameState.turnTimeLeft + 's';
          timerEl.className = gameState.turnTimeLeft <= 10
            ? 'px-2 py-1 rounded-lg bg-rose-900 text-rose-200 font-mono text-xs font-black animate-pulse'
            : 'px-2 py-1 rounded-lg bg-slate-800 text-emerald-300 font-mono text-xs font-black';
        }
        if (gameState.turnTimeLeft <= 0) {
          clearInterval(gameState.turnTimerId);
          if (isMyTurn()) {
            cleanupDragGhost();
            showToast('思考時間到，已自動抽牌並換下一位');
            drawTileAndEndTurn();
          } else {
            const cur = gameState.players[gameState.turnIndex];
            if (cur && cur.isAI && (gameState.mode === 'solo' || onlineState.isHost)) {
              cleanupDragGhost();
              drawTileAndEndTurn();
            }
          }
        }
      }, 1000);
    }

    function checkWinCondition() {
      const winner = gameState.players.find(p => p.hand.length === 0);
      if (!winner) return false;

      gameState.active = false;
      if (gameState.turnTimerId) clearInterval(gameState.turnTimerId);
      cleanupDragGhost();

      let totalPenalty = 0;
      const results = gameState.players.map(p => {
        const rem = p.hand.reduce((sum, t) => sum + (t.isJoker ? 30 : t.number), 0);
        totalPenalty += rem;
        return { player: p, penalty: rem };
      });

      results.forEach(r => {
        if (r.player.id === winner.id) r.delta = totalPenalty;
        else r.delta = -r.penalty;
        r.player.score += r.delta;
      });

      results.sort((a, b) => b.delta - a.delta);

      document.getElementById('winner-title').textContent = `🎉 ${winner.avatar} ${winner.name} 率先清空手牌獲勝！`;
      const board = document.getElementById('gameover-scoreboard');
      board.innerHTML = results.map((r, idx) => `
        <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-slate-800/90 border ${idx === 0 ? 'border-amber-400' : 'border-slate-700'}">
          <div class="flex items-center gap-2">
            <span class="font-black text-amber-300 w-5">#${idx + 1}</span>
            <span class="text-lg">${r.player.avatar}</span>
            <span class="text-xs font-black text-white">${escapeHtml(r.player.name)}</span>
          </div>
          <div class="text-right">
            <div class="text-xs font-black ${r.delta >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
              ${r.delta >= 0 ? '+' + r.delta : r.delta} 分
            </div>
            <div class="text-[10px] text-slate-400">剩餘 ${r.player.hand.length} 張</div>
          </div>
        </div>
      `).join('');

      document.getElementById('gameover-modal').classList.remove('hidden');
      playTone(880, 0.25);
      if (gameState.mode === 'online' && onlineState.isHost) syncOnlineGameState('GAME_STATE_SYNC');
      return true;
    }

    // ==================== 提示與 AI 玩家引擎（提示僅針對玩家手牌區） ====================
    function findBestHandMelds(hand, allowJokers = true) {
      const avail = allowJokers ? [...hand] : hand.filter(t => !t.isJoker);
      const jokers = avail.filter(t => t.isJoker);
      const regulars = avail.filter(t => !t.isJoker);
      const candidates = [];

      for (let num = 1; num <= 13; num++) {
        const sameNum = [];
        const seenColors = new Set();
        regulars.filter(t => t.number === num).forEach(t => {
          if (!seenColors.has(t.color)) {
            seenColors.add(t.color);
            sameNum.push(t);
          }
        });
        if (sameNum.length >= 3) {
          candidates.push(sameNum);
        } else if (sameNum.length === 2 && jokers.length >= 1) {
          candidates.push([...sameNum, jokers[0]]);
        }
      }

      for (const color of TILE_COLORS) {
        const byNum = new Map();
        regulars.filter(t => t.color === color).forEach(t => {
          if (!byNum.has(t.number)) byNum.set(t.number, t);
        });
        for (let start = 1; start <= 11; start++) {
          const seq = [];
          let usedJokers = 0;
          for (let n = start; n <= 13; n++) {
            if (byNum.has(n)) {
              seq.push(byNum.get(n));
            } else if (usedJokers < jokers.length) {
              seq.push(jokers[usedJokers++]);
            } else {
              break;
            }
            if (seq.length >= 3 && seq.some(t => !t.isJoker)) {
              candidates.push([...seq]);
            }
          }
        }
      }

      candidates.sort((a, b) => {
        const pa = validateMeld(a).points + a.length * 3;
        const pb = validateMeld(b).points + b.length * 3;
        return pb - pa;
      });

      const usedIds = new Set();
      const chosen = [];
      for (const cand of candidates) {
        if (cand.every(t => !usedIds.has(t.id))) {
          cand.forEach(t => usedIds.add(t.id));
          chosen.push(arrangeMeldDisplayOrder(cand));
        }
      }
      return chosen;
    }

    function showSmartHint() {
      if (!isMyTurn()) {
        showToast('輪到你的回合時才能使用提示喔！');
        return;
      }
      const me = getMyPlayer();
      if (!me) return;

      const melds = findBestHandMelds(me.hand, true);
      if (melds.length > 0) {
        const totalPts = melds.reduce((s, m) => s + validateMeld(m).points, 0);
        if (!me.melded && totalPts < 30) {
          showToast(`手牌本身可湊 ${totalPts} 分，尚差 ${30 - totalPts} 分才能破冰（牌桌組牌請自行觀察）`, 'info');
          gameState.hintTileIds = new Set(melds.flat().map(t => t.id));
          renderRack();
          return;
        }
        gameState.hintTileIds = new Set(melds[0].map(t => t.id));
        gameState.selectedTileIds = new Set(melds[0].map(t => t.id));
        renderRack();
        showToast(`💡 手牌可組成高亮牌組（${validateMeld(melds[0]).points} 分）！`, 'success');
        return;
      }

      gameState.hintTileIds.clear();
      renderRack();
      showToast('目前手牌區內無可獨立組成的牌組（牌桌能否拆併請自行判定）');
    }

    function computeAIStepActions(aiPlayer) {
      const actions = [];
      const diff = gameState.aiDifficulty || 'hard';
      let simHand = [...aiPlayer.hand];
      let simTable = JSON.parse(JSON.stringify(gameState.tableMelds));
      let isMelded = aiPlayer.melded;

      const handMelds = findBestHandMelds(simHand, true);
      const totalPts = handMelds.reduce((s, m) => s + validateMeld(m).points, 0);

      if (!isMelded) {
        if (totalPts >= 30) {
          handMelds.forEach(m => {
            const ids = new Set(m.map(t => t.id));
            simHand = simHand.filter(t => !ids.has(t.id));
            actions.push({ type: 'NEW_MELD', tiles: m });
          });
          isMelded = true;
        }
      } else {
        const toPlay = diff === 'normal' ? handMelds.slice(0, 1) : handMelds;
        toPlay.forEach(m => {
          const ids = new Set(m.map(t => t.id));
          simHand = simHand.filter(t => !ids.has(t.id));
          actions.push({ type: 'NEW_MELD', tiles: m });
        });
      }

      if (isMelded && simHand.length > 0) {
        let progressed = true;
        while (progressed) {
          progressed = false;
          for (let i = 0; i < simHand.length; i++) {
            const tile = simHand[i];
            for (const tm of simTable) {
              if (validateMeld([...tm.tiles, tile]).valid) {
                tm.tiles = arrangeMeldDisplayOrder([...tm.tiles, tile]);
                simHand.splice(i, 1);
                actions.push({ type: 'APPEND_MELD', targetMeldId: tm.id, tiles: [tile] });
                progressed = true;
                break;
              }
            }
            if (progressed) break;
          }
        }
      }

      if (isMelded && diff === 'master' && simHand.length >= 2) {
        for (let mIdx = 0; mIdx < simTable.length; mIdx++) {
          const tm = simTable[mIdx];
          if (tm.tiles.length >= 4) {
            const extraTile = tm.tiles[tm.tiles.length - 1];
            const remainTable = tm.tiles.slice(0, -1);
            if (validateMeld(remainTable).valid) {
              const combo = findBestHandMelds([...simHand, extraTile], true);
              const usesBorrowed = combo.find(c => c.some(t => t.id === extraTile.id));
              if (usesBorrowed) {
                const handUsedIds = new Set(usesBorrowed.filter(t => t.id !== extraTile.id).map(t => t.id));
                simHand = simHand.filter(t => !handUsedIds.has(t.id));
                actions.push({
                  type: 'STEAL_AND_MELD',
                  sourceMeldId: tm.id,
                  borrowedTile: extraTile,
                  newMeldTiles: usesBorrowed
                });
                break;
              }
            }
          }
        }
      }

      return actions;
    }

    function scheduleAITurn() {
      const cur = gameState.players[gameState.turnIndex];
      if (!cur || !cur.isAI || !gameState.active) return;

      const aiTurnId = cur.id;
      const aiTurnIdx = gameState.turnIndex;

      setTimeout(() => {
        if (!gameState.active || gameState.turnIndex !== aiTurnIdx || gameState.players[gameState.turnIndex]?.id !== aiTurnId) return;

        let actions = [];
        try {
          actions = computeAIStepActions(cur);
        } catch (err) {
          console.error('AI compute error:', err);
          actions = [];
        }

        if (!actions || actions.length === 0) {
          drawTileAndEndTurn();
          return;
        }

        let step = 0;
        let didPlayAny = false;
        const runStep = () => {
          if (!gameState.active || gameState.turnIndex !== aiTurnIdx || gameState.players[gameState.turnIndex]?.id !== aiTurnId) return;

          if (step >= actions.length) {
            if (didPlayAny) {
              cur.melded = true;
              if (checkWinCondition()) return;
              advanceToNextTurn();
            } else {
              drawTileAndEndTurn();
            }
            return;
          }

          const act = actions[step++];
          try {
            const ok = runProtectedMutation(() => {
              if (act.type === 'NEW_MELD') {
                const ids = new Set(act.tiles.map(t => t.id));
                cur.hand = cur.hand.filter(t => !ids.has(t.id));
                gameState.tableMelds.push({
                  id: 'meld_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                  tiles: arrangeMeldDisplayOrder(act.tiles)
                });
                act.tiles.forEach(t => gameState.newlyPlayedTileIds.add(t.id));
              } else if (act.type === 'APPEND_MELD') {
                const ids = new Set(act.tiles.map(t => t.id));
                cur.hand = cur.hand.filter(t => !ids.has(t.id));
                const target = gameState.tableMelds.find(m => m.id === act.targetMeldId);
                if (target) {
                  target.tiles = arrangeMeldDisplayOrder([...target.tiles, ...act.tiles]);
                  act.tiles.forEach(t => gameState.newlyPlayedTileIds.add(t.id));
                }
              } else if (act.type === 'STEAL_AND_MELD') {
                const src = gameState.tableMelds.find(m => m.id === act.sourceMeldId);
                if (src) {
                  src.tiles = src.tiles.filter(t => t.id !== act.borrowedTile.id);
                }
                const handIds = new Set(act.newMeldTiles.map(t => t.id));
                cur.hand = cur.hand.filter(t => !handIds.has(t.id));
                gameState.tableMelds.push({
                  id: 'meld_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                  tiles: arrangeMeldDisplayOrder(act.newMeldTiles)
                });
                act.newMeldTiles.forEach(t => gameState.newlyPlayedTileIds.add(t.id));
              }
            });
            if (ok) didPlayAny = true;
          } catch (e) {
            console.error('AI step mutation error:', e);
          }

          playTone(580, 0.07);
          renderAll();
          if (gameState.mode === 'online') syncOnlineGameState('GAME_STATE_SYNC');
          setTimeout(runStep, 420);
        };

        runStep();
      }, 650);
    }

    // ==================== 互動拖移系統（整組牌拖移 & 原位置隱藏） ====================
    function buildDragGhostGroup(sourceTileEl, tileIds, event, rect) {
      const ghost = document.createElement('div');
      ghost.className = 'drag-ghost-group';

      const allTilesMap = new Map();
      const me = getMyPlayer();
      if (me) me.hand.forEach(t => allTilesMap.set(t.id, t));
      gameState.tableMelds.forEach(m => m.tiles.forEach(t => allTilesMap.set(t.id, t)));

      tileIds.forEach(id => {
        const t = allTilesMap.get(id);
        if (t) ghost.appendChild(createTileElement(t, false));
      });

      document.body.appendChild(ghost);
      const offsetX = Math.min(rect.width * 0.7, Math.max(16, event.clientX - rect.left));
      const offsetY = Math.min(rect.height * 0.7, Math.max(16, event.clientY - rect.top));
      ghost.style.left = (event.clientX - offsetX) + 'px';
      ghost.style.top = (event.clientY - offsetY) + 'px';

      return { ghostEl: ghost, offsetX, offsetY };
    }

    function updateOriginTilesHiddenState(tileIds) {
      document.querySelectorAll('.rummi-tile.tile-dragging-origin').forEach(el => el.classList.remove('tile-dragging-origin'));
      (tileIds || []).forEach(id => {
        const el = document.querySelector(`[data-tile-id="${id}"]`);
        if (el) el.classList.add('tile-dragging-origin');
      });
    }

    function cleanupDragGhost() {
      document.querySelectorAll('.meld-group.meld-drop-hover').forEach(el => el.classList.remove('meld-drop-hover'));
      document.querySelectorAll('.rummi-tile.tile-dragging-origin').forEach(el => el.classList.remove('tile-dragging-origin'));
      if (dragState && dragState.ghostEl) {
        try { dragState.ghostEl.remove(); } catch (e) {}
      }
      dragState = null;
    }

    function handleTilePointerDown(event, tileId, sourceType) {
      if (event.button !== undefined && event.button !== 0) return;
      if (dragState) return;

      const tileEl = event.currentTarget;
      const rect = tileEl.getBoundingClientRect();

      dragState = {
        pointerId: event.pointerId,
        tileId,
        sourceType,
        tileEl,
        tileRect: rect,
        startX: event.clientX,
        startY: event.clientY,
        moved: false,
        dragTileIds: [tileId],
        ghostEl: null,
        offsetX: rect.width / 2,
        offsetY: rect.height / 2
      };

      const { ghostEl, offsetX, offsetY } = buildDragGhostGroup(tileEl, [tileId], event, rect);
      ghostEl.style.opacity = '0';
      dragState.ghostEl = ghostEl;
      dragState.offsetX = offsetX;
      dragState.offsetY = offsetY;
    }

    function handleGlobalPointerMove(event) {
      if (!dragState || event.pointerId !== dragState.pointerId) return;
      if (event.cancelable) event.preventDefault();

      const dx = event.clientX - dragState.startX;
      const dy = event.clientY - dragState.startY;
      if (!dragState.moved && Math.hypot(dx, dy) > 5) {
        dragState.moved = true;

        let groupIds = [dragState.tileId];
        if (gameState.selectedTileIds.has(dragState.tileId) && gameState.selectedTileIds.size > 1) {
          groupIds = Array.from(gameState.selectedTileIds);
        } else if (dragState.sourceType === 'rack') {
          groupIds = detectContiguousRackMeldAtTile(dragState.tileId);
        }

        dragState.dragTileIds = groupIds;
        if (groupIds.length > 1) {
          groupIds.forEach(id => gameState.selectedTileIds.add(id));
          if (dragState.ghostEl) {
            try { dragState.ghostEl.remove(); } catch (e) {}
          }
          const rebuilt = buildDragGhostGroup(dragState.tileEl, groupIds, event, dragState.tileRect);
          dragState.ghostEl = rebuilt.ghostEl;
          dragState.offsetX = rebuilt.offsetX;
          dragState.offsetY = rebuilt.offsetY;
        }

        if (dragState.ghostEl) dragState.ghostEl.style.opacity = '1';
        updateOriginTilesHiddenState(groupIds);
      }

      if (dragState.moved && dragState.ghostEl) {
        dragState.ghostEl.style.left = (event.clientX - dragState.offsetX) + 'px';
        dragState.ghostEl.style.top = (event.clientY - dragState.offsetY) + 'px';

        document.querySelectorAll('.meld-group.meld-drop-hover').forEach(el => el.classList.remove('meld-drop-hover'));
        const under = document.elementFromPoint(event.clientX, event.clientY);
        const meldEl = under ? under.closest('.meld-group') : null;
        if (meldEl) meldEl.classList.add('meld-drop-hover');
      }
    }

    function handleGlobalPointerUp(event) {
      if (!dragState || event.pointerId !== dragState.pointerId) return;
      const state = dragState;
      cleanupDragGhost();

      if (!state.moved) {
        if (gameState.selectedTileIds.has(state.tileId)) {
          gameState.selectedTileIds.delete(state.tileId);
        } else {
          gameState.selectedTileIds.add(state.tileId);
        }
        playTone(500, 0.04);
        renderAll();
        return;
      }

      if (!isMyTurn()) {
        renderAll();
        showToast('目前不是你的回合');
        return;
      }

      state.dragTileIds.forEach(id => gameState.selectedTileIds.add(id));

      const underEl = document.elementFromPoint(event.clientX, event.clientY);
      const targetMeldEl = underEl ? underEl.closest('.meld-group') : null;
      const inTableArea = underEl ? underEl.closest('#table-area') : null;
      const inRackArea = underEl ? underEl.closest('#rack-area') : null;

      if (targetMeldEl && targetMeldEl.dataset.meldId) {
        appendSelectedToExistingMeld(targetMeldEl.dataset.meldId);
      } else if (inTableArea) {
        playSelectedTilesToNewMeld();
      } else if (inRackArea && state.sourceType === 'table') {
        returnSelectedTableTilesToRack();
      } else {
        renderAll();
      }
    }

    // ==================== 渲染畫面（玩家狀態欄、牌桌、手牌架） ====================
    function renderAll() {
      renderPlayersBar();
      renderTopStatusBar();
      renderTable();
      renderRack();
    }

    function renderPlayersBar() {
      const bar = document.getElementById('players-bar');
      if (!bar) return;
      const isLandscape = document.getElementById('game-view')?.classList.contains('is-landscape');
      const count = gameState.players.length;
      const sideH = window.innerHeight;
      const cardH = isLandscape ? Math.floor((sideH - 12 - (count - 1) * 6) / Math.max(2, count)) : 48;
      const avatarSize = isLandscape ? Math.min(44, Math.max(24, Math.round(cardH * 0.24))) : 22;
      const nameSize = isLandscape ? Math.min(18, Math.max(13, Math.round(cardH * 0.12))) : 12;
      const countSize = isLandscape ? Math.min(24, Math.max(15, Math.round(cardH * 0.16))) : 13;

      bar.innerHTML = gameState.players.map((p, idx) => {
        const isTurn = idx === gameState.turnIndex;
        const bubble = gameState.chatBubbles[p.id];
        const bubbleHtml = (bubble && bubble.expiresAt > Date.now())
          ? `<div class="chat-bubble-pop absolute -bottom-6 left-2 z-30 px-2.5 py-0.5 rounded-full bg-amber-400 text-slate-950 text-[11px] font-black shadow-lg whitespace-nowrap">${escapeHtml(bubble.text)}</div>`
          : '';

        if (isLandscape) {
          return `
            <div class="player-card relative flex flex-col items-center justify-center text-center px-2 py-1.5 rounded-2xl border transition-all ${
              isTurn
                ? 'bg-gradient-to-b from-amber-500/30 to-emerald-900/80 border-amber-400 shadow-lg shadow-amber-500/20'
                : 'bg-slate-900/80 border-slate-700/80 opacity-85'
            }">
              <div style="font-size:${avatarSize}px;line-height:1.1">${p.avatar}</div>
              <div style="font-size:${nameSize}px" class="font-black text-white w-full break-words leading-tight mt-1">
                ${escapeHtml(p.name)} ${p.isHost ? '👑' : ''}
              </div>
              <div class="mt-1 px-2 py-0.5 rounded-full text-[11px] font-black ${
                p.melded ? 'bg-emerald-500/25 text-emerald-300 border border-emerald-400/40' : 'bg-slate-800 text-slate-300'
              }">
                ${p.melded ? '✓ 已破冰' : '未破冰'}
              </div>
              <div style="font-size:${countSize}px" class="mt-1 font-mono font-black text-amber-300 leading-none">
                ${p.hand.length} <span class="text-[11px] font-bold text-slate-300">張</span>
              </div>
              ${bubbleHtml}
            </div>
          `;
        } else {
          return `
            <div class="player-card relative flex items-center justify-between gap-1.5 border transition-all ${
              isTurn
                ? 'bg-gradient-to-r from-amber-500/25 to-emerald-900/75 border-amber-400 shadow-md'
                : 'bg-slate-900/85 border-slate-700/80 opacity-85'
            }">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="text-xl shrink-0">${p.avatar}</span>
                <div class="min-w-0">
                  <div class="text-xs font-black text-white leading-tight break-all">
                    ${escapeHtml(p.name)}${p.isHost ? '👑' : ''}
                  </div>
                  <div class="text-[10px] font-bold leading-tight ${p.melded ? 'text-emerald-300' : 'text-slate-400'}">
                    ${p.melded ? '✓ 已破冰' : '未破冰'}
                  </div>
                </div>
              </div>
              <div class="px-2 py-0.5 rounded-lg bg-slate-950/75 border border-slate-700 text-xs font-mono font-black text-amber-300 shrink-0 whitespace-nowrap">
                ${p.hand.length}張
              </div>
              ${bubbleHtml}
            </div>
          `;
        }
      }).join('');
    }

    function renderTopStatusBar() {
      const cur = gameState.players[gameState.turnIndex];
      const badge = document.getElementById('turn-badge');
      if (badge && cur) {
        badge.textContent = cur.id === myPeerId ? '🔥 輪到你出牌' : `⏳ 輪到：${cur.name}`;
      }
      const poolEl = document.getElementById('pool-count');
      if (poolEl) poolEl.textContent = String(gameState.pool.length);

      const primaryBtn = document.getElementById('primary-action-btn');
      if (primaryBtn) {
        if (!isMyTurn()) {
          primaryBtn.textContent = '⏳ 等待中';
          primaryBtn.className = 'py-2 px-1 rounded-xl bg-slate-700 text-slate-400 text-[11px] sm:text-xs font-black leading-tight whitespace-nowrap';
        } else if (hasBoardChangesThisTurn()) {
          primaryBtn.textContent = '✅ 確認出牌';
          primaryBtn.className = 'py-2 px-1 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-[11px] sm:text-xs font-black leading-tight whitespace-nowrap shadow-lg active:scale-95';
        } else {
          primaryBtn.textContent = '🃏 抽牌結束';
          primaryBtn.className = 'py-2 px-1 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-[11px] sm:text-xs font-black leading-tight whitespace-nowrap shadow-lg active:scale-95';
        }
      }
    }

    function createTileElement(tile, isTable) {
      const el = document.createElement('div');
      el.dataset.tileId = tile.id;
      el.setAttribute('draggable', 'false');

      const classes = ['rummi-tile'];
      if (isTable) classes.push('table-tile');
      if (gameState.selectedTileIds.has(tile.id)) classes.push('selected');
      if (isTable && gameState.newlyPlayedTileIds.has(tile.id)) classes.push('newly-played');
      if (!isTable && gameState.hintTileIds.has(tile.id)) classes.push('hint-highlight');
      el.className = classes.join(' ');

      if (tile.isJoker) {
        el.innerHTML = `<span class="tile-num color-red">☺</span><span class="tile-pip pip-orange"></span>`;
      } else {
        el.innerHTML = `<span class="tile-num color-${tile.color}">${tile.number}</span><span class="tile-pip pip-${tile.color}"></span>`;
      }

      el.addEventListener('pointerdown', (e) => handleTilePointerDown(e, tile.id, isTable ? 'table' : 'rack'));
      return el;
    }

    function renderTable() {
      const container = document.getElementById('table-melds-container');
      if (!container) return;
      container.innerHTML = '';

      if (gameState.tableMelds.length === 0) {
        const hint = document.createElement('div');
        hint.className = 'w-full h-full min-h-[120px] flex flex-col items-center justify-center text-center text-emerald-200/60 text-xs font-bold pointer-events-none gap-1';
        hint.innerHTML = `
          <span>將下方手牌（或整組牌）拖移至此處出牌</span>
          <span class="text-[11px] text-amber-300/80">首次破冰需達 30 分以上</span>
        `;
        container.appendChild(hint);
        return;
      }

      gameState.tableMelds.forEach(meld => {
        const groupEl = document.createElement('div');
        const check = validateMeld(meld.tiles);
        groupEl.dataset.meldId = meld.id;
        groupEl.className = `meld-group ${check.valid ? 'valid-meld' : 'invalid-meld'}`;

        meld.tiles.forEach(tile => {
          groupEl.appendChild(createTileElement(tile, true));
        });

        groupEl.addEventListener('click', (e) => {
          if (e.target === groupEl && isMyTurn() && gameState.selectedTileIds.size > 0) {
            appendSelectedToExistingMeld(meld.id);
          }
        });

        container.appendChild(groupEl);
      });
    }

    function renderRack() {
      const row0 = document.getElementById('rack-row-0');
      const row1 = document.getElementById('rack-row-1');
      if (!row0 || !row1) return;

      row0.innerHTML = '';
      row1.innerHTML = '';
      row0.style.gap = 'var(--rack-gap)';
      row1.style.gap = 'var(--rack-gap)';

      const me = getMyPlayer();
      if (!me) return;

      const total = me.hand.length;
      const splitIdx = Math.ceil(total / 2);

      me.hand.forEach((tile, idx) => {
        const tileEl = createTileElement(tile, false);
        if (idx < splitIdx) row0.appendChild(tileEl);
        else row1.appendChild(tileEl);
      });
    }

    // ==================== 牌桌氣泡與離開控制 ====================
    function toggleQuickChatModal(force) {
      const modal = document.getElementById('quick-chat-modal');
      if (!modal) return;
      const show = force !== undefined ? force : modal.classList.contains('hidden');
      modal.classList.toggle('hidden', !show);
    }

    function sendInGameBubble(text) {
      toggleQuickChatModal(false);
      triggerPlayerBubble(myPeerId, text);
      if (gameState.mode === 'online') {
        sendRoomMessage({ type: 'INGAME_BUBBLE', senderId: myPeerId, playerId: myPeerId, text });
      }
    }

    function sendCustomInGameBubble() {
      const inp = document.getElementById('ingame-chat-input');
      const val = (inp ? inp.value : '').trim();
      if (!val) return;
      inp.value = '';
      sendInGameBubble(val);
    }

    function triggerPlayerBubble(playerId, text) {
      gameState.chatBubbles[playerId] = { text, expiresAt: Date.now() + 3400 };
      renderPlayersBar();
      setTimeout(() => renderPlayersBar(), 3500);
    }

    function confirmExitGame() {
      exitToLobby();
    }

    function exitToLobby() {
      cleanupDragGhost();
      gameState.active = false;
      if (gameState.turnTimerId) clearInterval(gameState.turnTimerId);
      document.getElementById('gameover-modal').classList.add('hidden');
      document.getElementById('game-view').classList.add('hidden');
      document.getElementById('lobby-view').classList.remove('hidden');
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // ==================== 應用程式啟動初始化 ====================
    function initRummikubApp() {
      const savedName = localStorage.getItem('rmk_nickname');
      const savedAvatar = localStorage.getItem('rmk_avatar');
      const nameInput = document.getElementById('player-name-input');
      const avatarBtn = document.getElementById('my-avatar-btn');

      if (savedAvatar !== null && !isNaN(Number(savedAvatar))) {
        myAvatarIdx = Number(savedAvatar) % AVATARS.length;
      }
      if (avatarBtn) avatarBtn.textContent = AVATARS[myAvatarIdx];
      if (nameInput) nameInput.value = savedName || ('玩家_' + myPeerId.slice(-3).toUpperCase());

      window.addEventListener('pointermove', handleGlobalPointerMove, { passive: false });
      window.addEventListener('pointerup', handleGlobalPointerUp);
      window.addEventListener('pointercancel', cleanupDragGhost);
      window.addEventListener('blur', cleanupDragGhost);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) cleanupDragGhost();
      });
      window.addEventListener('resize', updateResponsiveLayout);
      window.addEventListener('beforeunload', () => {
        if (onlineState.active) {
          sendRoomMessage({ type: 'LEAVE_ROOM', senderId: myPeerId });
        }
      });

      updateResponsiveLayout();
    }

    window.initRummikubApp = initRummikubApp;
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initRummikubApp);
    } else {
      initRummikubApp();
    }
  </script>
</body>

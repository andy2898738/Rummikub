<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>線上拉密對戰 Rummikub Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --tile-w: 44px;
      --tile-h: 62px;
      --tile-font: 22px;
      --table-tile-w: 38px;
      --table-tile-h: 54px;
      --table-tile-font: 19px;
      --rack-gap: 4px;
      --rack-pad-x: 8px;
      --rack-pad-y: 5px;
      --landscape-side-w: 220px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    input, textarea, select {
      user-select: text;
      -webkit-user-select: text;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b2419;
      color: #f8fafc;
    }

    .felt-bg {
      background-color: #0f3827;
      background-image:
        radial-gradient(circle at 50% 35%, rgba(28, 102, 70, 0.72) 0%, rgba(10, 42, 29, 0.96) 85%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 6px);
    }

    .wood-rack {
      background: linear-gradient(180deg, #7c4a27 0%, #5c3317 52%, #43220d 100%);
      border-top: 2px solid #a86b3e;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.55), inset 0 2px 3px rgba(255, 224, 185, 0.22);
    }

    .rack-slot-bar {
      background: linear-gradient(180deg, rgba(28, 13, 4, 0.68) 0%, rgba(56, 28, 10, 0.42) 100%);
      border-bottom: 2px solid #965b32;
      border-radius: 8px;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.55);
    }

    .rummi-tile {
      width: var(--tile-w);
      height: var(--tile-h);
      border-radius: 8px;
      background: linear-gradient(160deg, #fffdf9 0%, #f7efe0 78%, #eadcc4 100%);
      box-shadow:
        0 3px 0 #b8a484,
        0 5px 10px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.95);
      border: 1px solid #dfd0b8;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: grab;
      flex-shrink: 0;
      touch-action: none;
      transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.14s ease;
    }

    .rummi-tile:active {
      cursor: grabbing;
    }

    .rummi-tile.tile-dragging-origin {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .rummi-tile.table-tile {
      width: var(--table-tile-w);
      height: var(--table-tile-h);
      border-radius: 7px;
      box-shadow:
        0 2px 0 #b8a484,
        0 4px 7px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.95);
    }

    .rummi-tile .tile-num {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-weight: 700;
      font-size: var(--tile-font);
      line-height: 1;
      letter-spacing: -0.03em;
      pointer-events: none;
    }

    .rummi-tile.table-tile .tile-num {
      font-size: var(--table-tile-font);
    }

    .rummi-tile .tile-pip {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      margin-top: 3px;
      opacity: 0.92;
      pointer-events: none;
    }

    .rummi-tile.selected {
      transform: translateY(-9px) scale(1.05);
      box-shadow:
        0 0 0 2.5px #fbbf24,
        0 10px 18px rgba(0, 0, 0, 0.55),
        inset 0 1px 2px #fff;
      z-index: 20;
    }

    .rummi-tile.newly-played {
      box-shadow:
        0 0 0 2px #34d399,
        0 3px 0 #059669,
        0 5px 10px rgba(0, 0, 0, 0.4);
    }

    .rummi-tile.hint-highlight {
      animation: hintPulse 1s infinite alternate;
      box-shadow: 0 0 0 3px #38bdf8, 0 0 16px rgba(56, 189, 248, 0.9);
      z-index: 25;
    }

    @keyframes hintPulse {
      from { transform: translateY(-5px) scale(1.03); }
      to { transform: translateY(-10px) scale(1.07); }
    }

    /* 四色高對比清晰區分：深黑 / 純正鮮紅 / 亮寶藍 / 明亮金橘黃 */
    .color-black {
      color: #0f172a;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
    }
    .pip-black {
      background-color: #0f172a;
      border-radius: 999px;
    }

    .color-red {
      color: #dc2626;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
    }
    .pip-red {
      background-color: #dc2626;
      border-radius: 999px;
    }

    .color-blue {
      color: #0284c7;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
    }
    .pip-blue {
      background-color: #0284c7;
      border-radius: 999px;
    }

    /* 橘色調整為偏向亮金黃琥珀橘，並搭配方塊底座標記，與紅色形成強烈色相與明度差 */
    .color-orange {
      color: #e07b00;
      -webkit-text-stroke: 0.45px #92400e;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
    }
    .pip-orange {
      background-color: #f59e0b;
      border: 1px solid #92400e;
      border-radius: 2px !important;
      transform: rotate(45deg);
    }

    .meld-group {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 4px 6px;
      border-radius: 10px;
      background: rgba(6, 26, 17, 0.45);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.15s ease;
    }

    .meld-group.invalid-meld {
      background: rgba(153, 27, 27, 0.48);
      border-color: #f87171;
      box-shadow: 0 0 12px rgba(248, 113, 113, 0.35);
    }

    .meld-group.valid-meld {
      border-color: rgba(52, 211, 153, 0.35);
    }

    .meld-group.meld-drop-hover {
      border-color: #fbbf24 !important;
      background: rgba(251, 191, 36, 0.22) !important;
      transform: scale(1.03);
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.45);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 4px; }

    .chat-bubble-pop {
      animation: bubblePop 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
    }

    @keyframes bubblePop {
      from { opacity: 0; transform: translateY(6px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .drag-ghost-group {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px 6px;
      border-radius: 10px;
      background: rgba(251, 191, 36, 0.18);
      border: 1.5px solid rgba(251, 191, 36, 0.75);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.65);
      transform: scale(1.06) rotate(-1.5deg);
    }

    /* 直式模式（Portrait）：頂部狀態列改為長條橫放 2x2（上二人下二人），文字盡量完整顯示 */
    #game-view.is-portrait {
      display: flex;
      flex-direction: column;
    }

    #game-view.is-portrait #players-bar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      padding: 6px 8px 4px 8px;
      overflow: visible;
    }

    #game-view.is-portrait .player-card {
      padding: 6px 8px;
      min-height: 46px;
      border-radius: 11px;
    }

    /* 橫屏模式（Landscape）：左側玩家大格子由上而下均分佔滿全高 */
    #game-view.is-landscape {
      display: grid;
      grid-template-columns: var(--landscape-side-w) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas:
        "side top"
        "side table"
        "side rack";
    }

    #game-view.is-landscape #players-bar {
      grid-area: side;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(var(--active-player-count, 4), minmax(0, 1fr));
      gap: 6px;
      height: 100dvh;
      padding: 6px 6px 6px calc(6px + env(safe-area-inset-left));
      background: rgba(4, 18, 12, 0.92);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    #game-view.is-landscape #top-status-bar {
      grid-area: top;
      padding: 4px 10px;
    }

    #game-view.is-landscape #table-area {
      grid-area: table;
      padding: 6px 10px;
    }

    #game-view.is-landscape #rack-area {
      grid-area: rack;
    }
  </style>
</head>
<body class="felt-bg">

  <!-- Toast 提示 -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center gap-2 pointer-events-none w-[92%] max-w-md"></div>

  <!-- ==================== 1. 大廳畫面 ==================== -->
  <div id="lobby-view" class="w-full h-full flex flex-col items-center justify-center p-3 sm:p-5 overflow-y-auto custom-scroll">
    <div class="w-full max-w-lg bg-slate-900/90 backdrop-blur-md border border-amber-400/30 rounded-3xl shadow-2xl p-4 sm:p-6 my-auto">
      <!-- 標題與全螢幕切換 -->
      <div class="flex items-center justify-between gap-2 mb-4">
        <div class="flex items-center gap-2.5">
          <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center text-2xl shadow-lg shadow-amber-500/25">
            🀄
          </div>
          <div>
            <h1 class="text-xl sm:text-2xl font-black tracking-tight text-amber-300 leading-tight">線上拉密對戰</h1>
            <p class="text-[11px] text-emerald-300/80 font-medium">Rummikub Online · 2~4人經典數字牌</p>
          </div>
        </div>
        <button id="lobby-fs-btn" onclick="toggleFullScreen()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600/80 text-xs font-bold text-slate-200 transition">
          ⛶ 全螢幕
        </button>
      </div>

      <!-- 玩家暱稱與頭像設定 -->
      <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3 mb-3.5">
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-xs font-bold text-slate-300">你的玩家暱稱（可隨時修改並即時同步）</label>
          <span class="text-[11px] text-amber-400/90 font-semibold">點擊頭像可更換</span>
        </div>
        <div class="flex items-center gap-2.5">
          <button id="my-avatar-btn" onclick="cycleMyAvatar()" class="w-11 h-11 rounded-xl bg-slate-700 hover:bg-slate-600 border border-amber-400/40 text-2xl flex items-center justify-center shrink-0 transition active:scale-95">
            🦊
          </button>
          <input id="player-name-input" type="text" maxlength="12" placeholder="輸入你的暱稱..." oninput="handleNicknameChanged()"
            class="w-full bg-slate-900/90 border border-slate-600 focus:border-amber-400 rounded-xl px-3 py-2 text-sm font-bold text-white outline-none transition" />
        </div>
      </div>

      <!-- 模式分頁切換 -->
      <div class="grid grid-cols-2 gap-1.5 bg-slate-950/70 p-1 rounded-2xl border border-slate-800 mb-3.5">
        <button id="tab-solo-btn" onclick="switchLobbyTab('solo')" class="py-2 rounded-xl text-sm font-black transition bg-amber-500 text-slate-950 shadow">
          🤖 單機 AI 對戰
        </button>
        <button id="tab-online-btn" onclick="switchLobbyTab('online')" class="py-2 rounded-xl text-sm font-black transition text-slate-300 hover:text-white">
          🌐 線上好友對戰
        </button>
      </div>

      <!-- 單機模式面板 -->
      <div id="panel-solo" class="space-y-3">
        <div class="bg-slate-800/70 border border-slate-700/70 rounded-2xl p-3.5 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-300">對戰人數</span>
            <div class="flex gap-1.5" id="solo-count-group">
              <button onclick="setSoloPlayerCount(2)" data-count="2" class="solo-count-btn px-3 py-1.5 rounded-xl text-xs font-black bg-slate-700 text-slate-300">2 人</button>
              <button onclick="setSoloPlayerCount(3)" data-count="3" class="solo-count-btn px-3 py-1.5 rounded-xl text-xs font-black bg-slate-700 text-slate-300">3 人</button>
              <button onclick="setSoloPlayerCount(4)" data-count="4" class="solo-count-btn px-3 py-1.5 rounded-xl text-xs font-black bg-emerald-500 text-slate-950">4 人</button>
            </div>
          </div>

          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-bold text-slate-300 shrink-0">AI 電腦難度</span>
            <select id="solo-ai-diff" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-1.5 text-xs font-bold text-amber-300 outline-none">
              <option value="normal">標準策略（穩健出牌）</option>
              <option value="hard" selected>精通拆組（高分連擊）</option>
              <option value="master">🔥 宗師必勝（極限拆桌）</option>
            </select>
          </div>
        </div>

        <button onclick="startSoloGame()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-base shadow-lg shadow-emerald-600/30 transition active:scale-[0.99]">
          🚀 立即開始單機對戰
        </button>
      </div>

      <!-- 線上模式面板 -->
      <div id="panel-online" class="hidden space-y-3">
        <!-- 未進房狀態 -->
        <div id="online-entry-box" class="bg-slate-800/70 border border-slate-700/70 rounded-2xl p-3.5 space-y-3">
          <button onclick="createOnlineRoom()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-black text-sm shadow-lg shadow-amber-500/25 transition active:scale-[0.99]">
            ➕ 建立新對戰房間（產生 6 位數房號）
          </button>

          <div class="flex items-center gap-2">
            <div class="h-px bg-slate-700 flex-1"></div>
            <span class="text-[11px] font-bold text-slate-400">或輸入 6 位數純數字房號加入</span>
            <div class="h-px bg-slate-700 flex-1"></div>
          </div>

          <div class="flex gap-2">
            <input id="join-room-code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="輸入 6 位數字房號"
              oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6)"
              class="flex-1 bg-slate-900 border border-slate-600 focus:border-amber-400 rounded-xl px-3 py-2 text-center font-mono text-base font-black tracking-widest text-amber-300 outline-none" />
            <button onclick="joinOnlineRoom()" class="px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-sm transition shrink-0">
              加入房間
            </button>
          </div>
        </div>

        <!-- 已進房等待室 -->
        <div id="online-waiting-box" class="hidden bg-slate-800/85 border border-amber-400/40 rounded-2xl p-3.5 space-y-2.5">
          <div class="flex items-center justify-between gap-2 bg-slate-950/70 px-3 py-2 rounded-xl border border-slate-700">
            <div>
              <div class="text-[10px] text-slate-400 font-bold">六位數房間密碼</div>
              <div id="room-code-display" class="font-mono text-lg font-black tracking-widest text-amber-300">000000</div>
            </div>
            <div class="flex gap-1.5">
              <button onclick="copyRoomInvite()" class="px-2.5 py-1.5 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/50 text-amber-300 text-xs font-bold">
                📋 複製房號
              </button>
              <button onclick="leaveOnlineRoom()" class="px-2.5 py-1.5 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 border border-rose-400/40 text-rose-300 text-xs font-bold">
                離開房間
              </button>
            </div>
          </div>

          <div id="online-conn-mode-badge" class="text-[11px] text-emerald-300/90 font-semibold px-1">
            ● 連線就緒（開局後任一真人玩家皆可接管房主，斷線不中斷）
          </div>

          <!-- 房內玩家清單 -->
          <div id="online-members-list" class="grid grid-cols-2 gap-1.5"></div>

          <!-- 等待室固定高度可捲動聊天窗框 -->
          <div class="bg-slate-950/85 border border-slate-700/90 rounded-xl p-2 flex flex-col gap-1.5">
            <div class="flex items-center justify-between px-1">
              <span class="text-[11px] font-bold text-amber-300">💬 房間即時聊天室</span>
              <div class="flex gap-1">
                <button onclick="sendWaitingRoomChat('大家好！準備開局囉 👋')" class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-slate-300">👋 打招呼</button>
                <button onclick="sendWaitingRoomChat('我準備好了，可以開始！🔥')" class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-slate-300">🔥 準備好了</button>
              </div>
            </div>
            <div id="waiting-chat-messages" class="h-24 overflow-y-auto custom-scroll bg-slate-900/75 rounded-lg p-2 space-y-1 text-xs">
              <div class="text-slate-400 text-[11px]">系統：歡迎進入對戰房間，開局前可在此聊天互動！</div>
            </div>
            <div class="flex gap-1.5">
              <input id="waiting-chat-input" type="text" maxlength="60" placeholder="輸入聊天訊息..."
                onkeydown="if(event.key==='Enter'){event.preventDefault();sendWaitingRoomChat();}"
                class="flex-1 bg-slate-900/95 border border-slate-600 focus:border-amber-400 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 placeholder-slate-400 outline-none" />
              <button onclick="sendWaitingRoomChat()" class="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shrink-0">
                送出
              </button>
            </div>
          </div>

          <!-- 房主開局控制列 -->
          <div id="host-start-controls" class="pt-1 border-t border-slate-700/80 space-y-2">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
              <label class="flex items-center gap-1.5 text-slate-200 font-bold cursor-pointer">
                <input id="fill-ai-checkbox" type="checkbox" checked class="accent-amber-400 w-4 h-4" />
                未滿 4 人補 AI 電腦
              </label>
              <div class="flex items-center gap-1.5">
                <span class="text-slate-400 font-bold">AI 難度</span>
                <select id="online-ai-diff" onchange="broadcastRoomMembers()" class="bg-slate-900 border border-slate-600 rounded-lg px-2 py-1 text-xs font-bold text-amber-300 outline-none">
                  <option value="normal">標準策略</option>
                  <option value="hard" selected>精通拆組</option>
                  <option value="master">🔥 宗師必勝</option>
                </select>
              </div>
            </div>
            <button onclick="hostStartOnlineGame()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-sm shadow-lg transition">
              🎮 房主開始對戰
            </button>
          </div>

          <div id="guest-waiting-hint" class="hidden text-center py-2 text-xs font-bold text-amber-300 bg-amber-500/10 rounded-xl border border-amber-400/30">
            ⏳ 等待房主按下開始對戰（若原房主離線，系統會自動由下一位真人接任房主）
          </div>
        </div>
      </div>

      <!-- 規則速覽 -->
      <div class="mt-3.5 pt-3 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-400">
        <span>✅ 首次破冰需達 30 分</span>
        <span>🃏 拖移整組牌可整組出牌/併組</span>
      </div>
    </div>
  </div>

  <!-- ==================== 2. 對戰主畫面 ==================== -->
  <div id="game-view" class="hidden w-full h-full is-portrait">
    <!-- 玩家狀態欄（直式：上方 2x2 長條橫放；橫屏：左側由上而下均分大格子） -->
    <div id="players-bar"></div>

    <!-- 頂部回合資訊與功能列 -->
    <div id="top-status-bar" class="flex items-center justify-between gap-1.5 px-2.5 py-1.5 bg-slate-950/60 border-b border-white/10 shrink-0">
      <div class="flex items-center gap-1.5 flex-wrap">
        <span id="turn-badge" class="px-2.5 py-1 rounded-lg bg-amber-500/20 border border-amber-400/50 text-amber-300 text-xs font-black whitespace-nowrap">

        <span id="turn-timer" class="px-2 py-1 rounded-lg bg-slate-800 text-emerald-300 font-mono text-xs font-black">
          60s
        </span>
        <span class="px-2 py-1 rounded-lg bg-slate-800/90 text-slate-200 text-xs font-bold whitespace-nowrap">
          牌庫 <strong id="pool-count" class="text-amber-300">78</strong> 張
        </span>
      </div>

      <div class="flex items-center gap-1">
        <button onclick="toggleQuickChatModal()" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600/80 text-xs font-bold text-slate-200 whitespace-nowrap" title="發送表情/語音氣泡">
          💬 互動
        </button>
        <button id="sound-toggle-btn" onclick="toggleSound()" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600/80 text-xs font-bold text-slate-200">
          🔊
        </button>
        <button id="game-fs-btn" onclick="toggleFullScreen()" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600/80 text-xs font-bold text-slate-200">
          ⛶
        </button>
        <button onclick="confirmExitGame()" class="px-2 py-1 rounded-lg bg-rose-900/70 hover:bg-rose-800 border border-rose-500/40 text-xs font-bold text-rose-200 whitespace-nowrap">
          離開
        </button>
      </div>
    </div>

    <!-- 中央牌桌出牌區 -->
    <div id="table-area" class="flex-1 min-h-0 overflow-y-auto custom-scroll p-2.5 flex flex-col">
      <div id="table-melds-container" class="flex-1 flex flex-wrap content-start items-start gap-2.5 p-2 rounded-2xl border border-dashed border-emerald-400/25 bg-emerald-950/25 min-h-[140px]">
        <!-- 牌桌上的合法/編輯中牌組 -->
      </div>
    </div>

    <!-- 底部雙層木質手牌架與控制按鈕 -->
    <div id="rack-area" class="wood-rack px-2 pt-1.5 pb-[max(6px,env(safe-area-inset-bottom))] flex flex-col gap-1.5 shrink-0">
      <!-- 雙層木質牌架（靠左對齊） -->
      <div class="flex flex-col gap-1">
        <div id="rack-row-0" class="rack-slot-bar flex items-center justify-start px-1.5 py-1 min-h-[54px] overflow-x-auto no-scrollbar"></div>
        <div id="rack-row-1" class="rack-slot-bar flex items-center justify-start px-1.5 py-1 min-h-[54px] overflow-x-auto no-scrollbar"></div>
      </div>

      <!-- 5 顆理牌與回合操作控制鈕（直式盡量完整顯示所有文字） -->
      <div class="grid grid-cols-5 gap-1">
        <button onclick="sortRackByRuns()" class="py-2 px-1 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-100 text-[11px] sm:text-xs font-black leading-tight whitespace-nowrap active:scale-95">
          🔢 順子
        </button>
        <button onclick="sortRackByGroups()" class="py-2 px-1 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-100 text-[11px] sm:text-xs font-black leading-tight whitespace-nowrap active:scale-95">
          🎨 同數
        </button>
        <button onclick="showSmartHint()" class="py-2 px-1 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-[11px] sm:text-xs font-black leading-tight whitespace-nowrap shadow active:scale-95">
          💡 提示
        </button>
        <button onclick="resetCurrentTurn()" class="py-2 px-1 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-[11px] sm:text-xs font-black leading-tight whitespace-nowrap shadow active:scale-95">
          ↩️ 重置
        </button>
        <button id="primary-action-btn" onclick="handlePrimaryTurnAction()" class="py-2 px-1 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-[11px] sm:text-xs font-black leading-tight whitespace-nowrap shadow-lg active:scale-95">
          🃏 抽牌
        </button>
      </div>
    </div>
  </div>

  <!-- 快速表情/短語互動彈窗 -->
  <div id="quick-chat-modal" class="hidden fixed inset-0 z-50 bg-black/55 flex items-center justify-center p-4" onclick="if(event.target===this)toggleQuickChatModal(false)">
    <div class="bg-slate-900 border border-amber-400/40 rounded-2xl p-4 w-full max-w-xs space-y-3 shadow-2xl">
      <div class="flex items-center justify-between">
        <span class="text-sm font-black text-amber-300">💬 發送牌桌氣泡訊息</span>
        <button onclick="toggleQuickChatModal(false)" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-1.5 text-xs font-bold">
        <button onclick="sendInGameBubble('請快一點喔 ⏱️')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-left">⏱️ 請快一點喔</button>
        <button onclick="sendInGameBubble('漂亮的一手！👏')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-left">👏 漂亮的一手！</button>
        <button onclick="sendInGameBubble('差一張就胡了 😱')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-left">😱 差一張就胡了</button>
        <button onclick="sendInGameBubble('哈哈謝謝神救援 😂')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-left">😂 謝謝神救援</button>
      </div>
      <div class="flex gap-1.5">
        <input id="ingame-chat-input" type="text" maxlength="24" placeholder="自訂短語..."
          onkeydown="if(event.key==='Enter'){event.preventDefault();sendCustomInGameBubble();}"
          class="flex-1 bg-slate-950 border border-slate-600 rounded-xl px-2.5 py-1.5 text-xs text-white outline-none" />
        <button onclick="sendCustomInGameBubble()" class="px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 font-black text-xs">送出</button>
      </div>
    </div>
  </div>

  <!-- 結算勝利彈窗 -->
  <div id="gameover-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-amber-400/60 rounded-3xl p-5 w-full max-w-md space-y-4 shadow-2xl">
      <div class="text-center">
        <div class="text-4xl mb-1">🏆</div>
        <h2 id="winner-title" class="text-xl font-black text-amber-300">對局結束！</h2>
        <p id="winner-subtitle" class="text-xs text-slate-300 mt-1">本局積分排行結算</p>
      </div>
      <div id="gameover-scoreboard" class="space-y-2"></div>
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="exitToLobby()" class="py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-black text-sm">
          返回大廳
        </button>
        <button onclick="restartCurrentGame()" class="py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black text-sm">
          🔄 再來一局
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==================== 全域常數與狀態 ====================
    const AVATARS = ['🦊', '🐼', '🐯', '🦁', '🐸', '🐧', '🦄', '🐙', '🐨', '🐲'];
    const TILE_COLORS = ['black', 'red', 'blue', 'orange'];
    const COLOR_ORDER = { black: 0, red: 1, blue: 2, orange: 3, joker: 4 };

    let myAvatarIdx = 0;
    let myPeerId = 'p_' + Math.random().toString(36).slice(2, 10);
    let soloPlayerCount = 4;
    let audioCtx = null;
    let soundMuted = false;

    // 線上房間狀態
    let onlineState = {
      active: false,
      roomCode: '',
      isHost: false,
      hostId: '',
      peer: null,
      connections: {}, // peerId -> DataConnection
      bc: null,        // BroadcastChannel 沙盒與同瀏覽器多分頁支援
      members: [],     // [{ id, name, avatar, isHost, isAI }]
      heartbeatTimer: null,
      hostLastSeen: Date.now()
    };

    // 遊戲核心狀態
    let gameState = {
      active: false,
      mode: 'solo', // 'solo' | 'online'
      aiDifficulty: 'hard',
      players: [],  // [{ id, name, avatar, isAI, isHost, hand: [], melded: false, score: 0 }]
      pool: [],
      tableMelds: [], // [{ id, tiles: [] }]
      turnIndex: 0,
      turnTimeLeft: 60,
      turnTimerId: null,
      turnSnapshot: null, // 回合開始前快照（供重置與卡牌守恆檢驗）
      newlyPlayedTileIds: new Set(),
      selectedTileIds: new Set(),
      hintTileIds: new Set(),
      chatBubbles: {} // playerId -> { text, expiresAt }
    };

    let dragState = null;

    // ==================== 音效與提示工具 ====================
    function playTone(freq, duration = 0.08, type = 'triangle', vol = 0.08) {
      if (soundMuted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function toggleSound() {
      soundMuted = !soundMuted;
      const btn = document.getElementById('sound-toggle-btn');
      if (btn) btn.textContent = soundMuted ? '🔇' : '🔊';
      showToast(soundMuted ? '已靜音' : '已開啟音效');
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const bg = type === 'error'
        ? 'bg-rose-900/95 border-rose-400 text-rose-100'
        : type === 'success'
        ? 'bg-emerald-900/95 border-emerald-400 text-emerald-100'
        : 'bg-slate-900/95 border-amber-400/70 text-amber-100';
      el.className = `px-3.5 py-2 rounded-xl border text-xs font-bold shadow-xl backdrop-blur-md transition-all duration-300 ${bg}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => el.remove(), 280);
      }, 2400);
    }

    // ==================== 全螢幕與自適應版面計算 ====================
    function toggleFullScreen() {
      const docEl = document.documentElement;
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFs) {
        const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
        if (req) {
          req.call(docEl).catch(() => showToast('目前環境限制原生全螢幕，已啟用滿版視窗模式'));
        } else {
          showToast('已採用滿版自適應視窗');
        }
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document).catch(() => {});
      }
      setTimeout(updateResponsiveLayout, 150);
    }

    function updateResponsiveLayout() {
      const gv = document.getElementById('game-view');
      if (!gv) return;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const isLandscape = vw > vh && vw >= 540;

      gv.classList.toggle('is-landscape', isLandscape);
      gv.classList.toggle('is-portrait', !isLandscape);

      const playerCount = Math.max(2, gameState.players.length || 4);
      gv.style.setProperty('--active-player-count', String(playerCount));

      const sideW = isLandscape ? Math.min(250, Math.max(176, Math.round(vw * 0.24))) : 0;
      gv.style.setProperty('--landscape-side-w', sideW + 'px');

      const availRackW = Math.max(240, (isLandscape ? (vw - sideW) : vw) - 28);
      const me = getMyPlayer();
      const myCount = me ? me.hand.length : 14;
      const colsPerRow = Math.max(8, Math.ceil(myCount / 2));
      const gap = colsPerRow > 15 ? 2 : colsPerRow > 11 ? 3 : 4;
      const rawTileW = Math.floor((availRackW - (colsPerRow - 1) * gap) / colsPerRow);
      const tileW = Math.max(18, Math.min(isLandscape ? 46 : 44, rawTileW));
      const tileH = Math.round(tileW * 1.38);
      const tileFont = Math.max(11, Math.round(tileW * 0.52));

      const tableTileW = Math.max(24, Math.min(40, Math.round(tileW * 0.9)));
      const tableTileH = Math.round(tableTileW * 1.38);
      const tableFont = Math.max(12, Math.round(tableTileW * 0.52));

      const root = document.documentElement.style;
      root.setProperty('--tile-w', tileW + 'px');
      root.setProperty('--tile-h', tileH + 'px');
      root.setProperty('--tile-font', tileFont + 'px');
      root.setProperty('--table-tile-w', tableTileW + 'px');
      root.setProperty('--table-tile-h', tableTileH + 'px');
      root.setProperty('--table-tile-font', tableFont + 'px');
      root.setProperty('--rack-gap', gap + 'px');

      if (gameState.active) {
        renderPlayersBar();
        renderRack();
      }
    }

    // ==================== 大廳互動與線上房間系統 ====================
    function getMyName() {
      const inp = document.getElementById('player-name-input');
      const v = inp ? inp.value.trim() : '';
      return v || '玩家_' + myPeerId.slice(-3).toUpperCase();
    }

    function cycleMyAvatar() {
      myAvatarIdx = (myAvatarIdx + 1) % AVATARS.length;
      const btn = document.getElementById('my-avatar-btn');
      if (btn) btn.textContent = AVATARS[myAvatarIdx];
      localStorage.setItem('rmk_avatar', String(myAvatarIdx));
      handleNicknameChanged();
    }

    function handleNicknameChanged() {
      const name = getMyName();
      localStorage.setItem('rmk_nickname', name);
      if (onlineState.active && onlineState.roomCode) {
        const me = onlineState.members.find(m => m.id === myPeerId);
        if (me) {
          me.name = name;
          me.avatar = AVATARS[myAvatarIdx];
        }
        sendRoomMessage({
          type: 'UPDATE_MEMBER_NAME',
          senderId: myPeerId,
          name,
          avatar: AVATARS[myAvatarIdx]
        });
        if (onlineState.isHost) {
          broadcastRoomMembers();
        }
        updateOnlineMembersUI();
      }
    }

    function switchLobbyTab(tab) {
      const soloBtn = document.getElementById('tab-solo-btn');
      const onlineBtn = document.getElementById('tab-online-btn');
      const soloPanel = document.getElementById('panel-solo');
      const onlinePanel = document.getElementById('panel-online');

      if (tab === 'solo') {
        soloBtn.className = 'py-2 rounded-xl text-sm font-black transition bg-amber-500 text-slate-950 shadow';
        onlineBtn.className = 'py-2 rounded-xl text-sm font-black transition text-slate-300 hover:text-white';
        soloPanel.classList.remove('hidden');
        onlinePanel.classList.add('hidden');
      } else {
        onlineBtn.className = 'py-2 rounded-xl text-sm font-black transition bg-amber-500 text-slate-950 shadow';
        soloBtn.className = 'py-2 rounded-xl text-sm font-black transition text-slate-300 hover:text-white';
        onlinePanel.classList.remove('hidden');
        soloPanel.classList.add('hidden');
      }
    }

    function setSoloPlayerCount(cnt) {
      soloPlayerCount = cnt;
      document.querySelectorAll('.solo-count-btn').forEach(btn => {
        const active = Number(btn.dataset.count) === cnt;
        btn.className = active
          ? 'solo-count-btn px-3 py-1.5 rounded-xl text-xs font-black bg-emerald-500 text-slate-950'
          : 'solo-count-btn px-3 py-1.5 rounded-xl text-xs font-black bg-slate-700 text-slate-300';
      });
    }

    function generateRoomCode() {
      return String(Math.floor(100000 + Math.random() * 900000));
    }

    function canUseExternalWebSocket() {
      try {
        if (typeof Peer === 'undefined') return false;
        const host = window.location.hostname || '';
        if (window.location.protocol === 'about:' || host.includes('googleusercontent') || host.includes('webcontainer')) {
          return false;
        }
        return true;
      } catch (e) {
        return false;
      }
    }

    function setupBroadcastChannel(roomCode) {
      if (onlineState.bc) {
        try { onlineState.bc.close(); } catch (e) {}
      }
      if (typeof BroadcastChannel !== 'undefined') {
        onlineState.bc = new BroadcastChannel('rummikub_room_' + roomCode);
        onlineState.bc.onmessage = (ev) => {
          if (ev && ev.data) handleIncomingRoomPacket(ev.data);
        };
      }
    }

    function createOnlineRoom() {
      const code = generateRoomCode();
      onlineState.active = true;
      onlineState.roomCode = code;
      onlineState.isHost = true;
      onlineState.hostId = myPeerId;
      onlineState.members = [{
        id: myPeerId,
        name: getMyName(),
        avatar: AVATARS[myAvatarIdx],
        isHost: true,
        isAI: false
      }];

      setupBroadcastChannel(code);

      if (canUseExternalWebSocket()) {
        try {
          const peer = new Peer('rmk_host_' + code);
          onlineState.peer = peer;
          peer.on('connection', (conn) => {
            onlineState.connections[conn.peer] = conn;
            conn.on('data', (data) => handleIncomingRoomPacket(data, conn));
            conn.on('close', () => handleMemberDisconnected(conn.peer));
          });
          peer.on('error', () => {
            document.getElementById('online-conn-mode-badge').textContent = '● 本機多分頁與 AI 房間模式已啟動';
          });
        } catch (e) {
          document.getElementById('online-conn-mode-badge').textContent = '● 本機多分頁與 AI 房間模式已啟動';
        }
      } else {
        document.getElementById('online-conn-mode-badge').textContent = '● 沙盒同瀏覽器多分頁與 AI 房間模式（支援即時聊天與開局）';
      }

      document.getElementById('online-entry-box').classList.add('hidden');
      document.getElementById('online-waiting-box').classList.remove('hidden');
      document.getElementById('room-code-display').textContent = code;
      document.getElementById('waiting-chat-messages').innerHTML = '';
      appendWaitingChatSystem(`已建立房間 ${code}，歡迎邀請好友加入或勾選補 AI 開局！`);
      startRoomHeartbeat();
      updateOnlineMembersUI();
      showToast(`已建立房間：${code}`, 'success');
    }

    function joinOnlineRoom() {
      const code = (document.getElementById('join-room-code-input').value || '').trim();
      if (!/^\d{6}$/.test(code)) {
        showToast('請輸入正確的 6 位數純數字房號', 'error');
        return;
      }

      onlineState.active = true;
      onlineState.roomCode = code;
      onlineState.isHost = false;
      onlineState.hostId = '';
      onlineState.members = [{
        id: myPeerId,
        name: getMyName(),
        avatar: AVATARS[myAvatarIdx],
        isHost: false,
        isAI: false
      }];

      setupBroadcastChannel(code);

      const joinPayload = {
        type: 'JOIN_ROOM',
        senderId: myPeerId,
        member: {
          id: myPeerId,
          name: getMyName(),
          avatar: AVATARS[myAvatarIdx],
          isHost: false,
          isAI: false
        }
      };

      if (canUseExternalWebSocket()) {
        try {
          const peer = new Peer(myPeerId);
          onlineState.peer = peer;
          peer.on('open', () => {
            const conn = peer.connect('rmk_host_' + code);
            onlineState.connections['host'] = conn;
            conn.on('open', () => conn.send(joinPayload));
            conn.on('data', (data) => handleIncomingRoomPacket(data, conn));
            conn.on('close', () => handleHostFailover());
          });
          peer.on('error', () => {
            sendRoomMessage(joinPayload);
          });
        } catch (e) {
          sendRoomMessage(joinPayload);
        }
      } else {
        sendRoomMessage(joinPayload);
      }

      document.getElementById('online-entry-box').classList.add('hidden');
      document.getElementById('online-waiting-box').classList.remove('hidden');
      document.getElementById('room-code-display').textContent = code;
      document.getElementById('waiting-chat-messages').innerHTML = '';
      appendWaitingChatSystem(`已加入房間 ${code}，正在同步房內成員...`);
      startRoomHeartbeat();
      updateOnlineMembersUI();
    }

    function sendRoomMessage(payload) {
      if (onlineState.bc) {
        try { onlineState.bc.postMessage(payload); } catch (e) {}
      }
      Object.values(onlineState.connections).forEach(conn => {
        if (conn && conn.open) {
          try { conn.send(payload); } catch (e) {}
        }
      });
    }

    function broadcastRoomMembers() {
      if (!onlineState.isHost) return;
      const aiDiff = document.getElementById('online-ai-diff')?.value || 'hard';
      sendRoomMessage({
        type: 'ROOM_MEMBERS_SYNC',
        senderId: myPeerId,
        hostId: onlineState.hostId,
        members: onlineState.members,
        aiDifficulty: aiDiff
      });
    }

    function handleIncomingRoomPacket(data) {
      if (!data || data.senderId === myPeerId) return;

      if (data.type === 'JOIN_ROOM') {
        if (onlineState.isHost) {
          if (onlineState.members.length >= 4) {
            sendRoomMessage({ type: 'ROOM_FULL', targetId: data.senderId });
            return;
          }
          const exists = onlineState.members.find(m => m.id === data.member.id);
          if (!exists) {
            onlineState.members.push({ ...data.member, isHost: false });
            appendWaitingChatSystem(`🎉 ${data.member.avatar} ${data.member.name} 加入了房間！`);
            sendRoomMessage({
              type: 'ROOM_CHAT',
              senderId: myPeerId,
              isSystem: true,
              text: `🎉 ${data.member.avatar} ${data.member.name} 加入了房間！`
            });
          }
          broadcastRoomMembers();
          updateOnlineMembersUI();
        }
      } else if (data.type === 'ROOM_MEMBERS_SYNC') {
        onlineState.hostId = data.hostId;
        onlineState.isHost = (data.hostId === myPeerId);
        onlineState.members = data.members || [];
        onlineState.hostLastSeen = Date.now();
        if (data.aiDifficulty && document.getElementById('online-ai-diff')) {
          document.getElementById('online-ai-diff').value = data.aiDifficulty;
        }
        updateOnlineMembersUI();
      } else if (data.type === 'UPDATE_MEMBER_NAME') {
        const m = onlineState.members.find(x => x.id === data.senderId);
        if (m) {
          const oldName = m.name;
          m.name = data.name;
          m.avatar = data.avatar;
          if (oldName !== data.name) {
            appendWaitingChatSystem(`✏️ ${oldName} 已更名為 ${data.avatar} ${data.name}`);
          }
          if (onlineState.isHost) broadcastRoomMembers();
          updateOnlineMembersUI();
        }
        if (gameState.active) {
          const gp = gameState.players.find(p => p.id === data.senderId);
          if (gp) {
            gp.name = data.name;
            gp.avatar = data.avatar;
            renderPlayersBar();
          }
        }
      } else if (data.type === 'LEAVE_ROOM') {
        handleMemberDisconnected(data.senderId);
      } else if (data.type === 'ROOM_CHAT') {
        if (data.isSystem) {
          appendWaitingChatSystem(data.text);
        } else {
          appendWaitingChatBubble(data.avatar, data.name, data.text, false);
        }
      } else if (data.type === 'HEARTBEAT') {
        if (data.hostId) {
          onlineState.hostId = data.hostId;
          onlineState.hostLastSeen = Date.now();
        }
      } else if (data.type === 'START_ONLINE_GAME') {
        applySyncedGameState(data.snapshot, true);
      } else if (data.type === 'GAME_STATE_SYNC') {
        applySyncedGameState(data.snapshot, false);
      } else if (data.type === 'INGAME_BUBBLE') {
        triggerPlayerBubble(data.playerId, data.text);
      }
    }

    function handleMemberDisconnected(memberId) {
      const idx = onlineState.members.findIndex(m => m.id === memberId);
      if (idx !== -1) {
        const left = onlineState.members[idx];
        onlineState.members.splice(idx, 1);
        appendWaitingChatSystem(`🚪 ${left.name} 已離開房間`);
      }
      if (memberId === onlineState.hostId) {
        handleHostFailover();
      } else if (onlineState.isHost) {
        broadcastRoomMembers();
      }
      updateOnlineMembersUI();
    }

    function handleHostFailover() {
      const humans = onlineState.members.filter(m => !m.isAI);
      if (humans.length === 0) return;
      const nextHost = humans[0];
      onlineState.hostId = nextHost.id;
      onlineState.isHost = (nextHost.id === myPeerId);
      onlineState.members.forEach(m => { m.isHost = (m.id === nextHost.id); });

      if (onlineState.isHost) {
        showToast('原房主已離線，你已自動接管成為新房主！', 'success');
        appendWaitingChatSystem(`👑 原房主離線，已由 ${nextHost.name} 自動接任新房主！`);
        broadcastRoomMembers();
        if (gameState.active) {
          gameState.players.forEach(p => { p.isHost = (p.id === myPeerId); });
          renderPlayersBar();
          const cur = gameState.players[gameState.turnIndex];
          if (cur && cur.isAI) scheduleAITurn();
        }
      }
      updateOnlineMembersUI();
    }

    function startRoomHeartbeat() {
      if (onlineState.heartbeatTimer) clearInterval(onlineState.heartbeatTimer);
      onlineState.hostLastSeen = Date.now();
      onlineState.heartbeatTimer = setInterval(() => {
        if (!onlineState.active) return;
        if (onlineState.isHost) {
          sendRoomMessage({ type: 'HEARTBEAT', senderId: myPeerId, hostId: myPeerId });
        } else if (onlineState.hostId && Date.now() - onlineState.hostLastSeen > 8500) {
          handleHostFailover();
        }
      }, 2500);
    }

    function updateOnlineMembersUI() {
      const list = document.getElementById('online-members-list');
      if (!list) return;
      list.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const m = onlineState.members[i];
        const card = document.createElement('div');
        if (m) {
          card.className = 'flex items-center gap-2 bg-slate-900/90 border border-slate-700 rounded-xl px-2.5 py-2';
          card.innerHTML = `
            <span class="text-lg">${m.avatar}</span>
            <div class="min-w-0 flex-1">
              <div class="text-xs font-black text-white truncate">${escapeHtml(m.name)}</div>
              <div class="text-[10px] font-bold ${m.isHost ? 'text-amber-400' : 'text-emerald-400'}">
                ${m.isHost ? '👑 房主' : '● 已就緒'}
              </div>
            </div>
          `;
        } else {
          card.className = 'flex items-center gap-2 bg-slate-950/50 border border-dashed border-slate-700 rounded-xl px-2.5 py-2 text-slate-500';
          card.innerHTML = `<span class="text-sm">➕</span><span class="text-[11px] font-bold">等待好友 / AI 補位</span>`;
        }

      }

      const hostCtrl = document.getElementById('host-start-controls');

      if (onlineState.isHost) {

      const inp = document.getElementById('waiting-chat-input');
      const text = (presetText !== undefined ? presetText : (inp ? inp.value : '')).trim();
      if (!text) return;

      const row = document.createElement('div');
      row.className = 'text-[11px] text-amber-300/90 font-semibold';

      const row = document.createElement('div');

    function copyRoomInvite() {
      const code = onlineState.roomCode;
      if (!code) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => showToast(`已複製房號：${code}`, 'success')).catch(() => showToast(`房號：${code}`));
      } else {
        showToast(`房間密碼：${code}`);
      }
    }

    function leaveOnlineRoom() {
      if (onlineState.active) {
        sendRoomMessage({ type: 'LEAVE_ROOM', senderId: myPeerId });
      }
      if (onlineState.heartbeatTimer) clearInterval(onlineState.heartbeatTimer);
      if (onlineState.bc) {
        try { onlineState.bc.close(); } catch (e) {}
        onlineState.bc = null;
      }
      if (onlineState.peer) {
        try { onlineState.peer.destroy(); } catch (e) {}
        onlineState.peer = null;
      }
      onlineState.connections = {};
      onlineState.active = false;
      onlineState.roomCode = '';
      onlineState.isHost = false;
      onlineState.members = [];

      document.getElementById('online-waiting-box').classList.add('hidden');
      document.getElementById('online-entry-box').classList.remove('hidden');

    // ==================== 牌庫建立與洗牌 ====================
    function createFullDeck() {
      const deck = [];
      let uid = 1;
      for (let set = 0; set < 2; set++) {
        for (const color of TILE_COLORS) {
          for (let num = 1; num <= 13; num++) {
            deck.push({
              id: 't_' + (uid++),
              color,
              number: num,
              isJoker: false
            });
          }
        }
      }
      deck.push({ id: 't_' + (uid++), color: 'joker', number: 0, isJoker: true });
      deck.push({ id: 't_' + (uid++), color: 'joker', number: 0, isJoker: true });

      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    // ==================== 開局流程（單機 & 線上） ====================
    function startSoloGame() {
      const aiDiff = document.getElementById('solo-ai-diff')?.value || 'hard';
      const botNames = ['智慧阿爾法', '策略貝塔', '快手伽瑪'];
      const botAvatars = ['🤖', '🐼', '🦁'];
      const players = [{
        id: myPeerId,
        name: getMyName(),
        avatar: AVATARS[myAvatarIdx],
        isAI: false,
        isHost: true,
        hand: [],
        melded: false,
        score: 0
      }];

      for (let i = 1; i < soloPlayerCount; i++) {
        players.push({
          id: 'ai_' + i,
          name: botNames[i - 1],
          avatar: botAvatars[i - 1],
          isAI: true,
          isHost: false,
